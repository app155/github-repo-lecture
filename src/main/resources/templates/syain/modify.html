<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>社内統合管理システム</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			margin: 0;
			padding: 0;
		}

		body .sub-header {
			display: flex;
			justify-content: space-between;
			/* 左寄せと右寄せを実現 */
			font-size: 26px;
			padding-right: 10px;
			padding-left: 5px;
			align-items: baseline;
		}

		header {
			color: black;
			/* 背景色を削除し、文字色を黒に設定 */
			padding: 10px;
			text-align: center;
		}

		header .main-header {
			font-size: 2em;
			/* フォントサイズを2倍に */
		}

		header .sub-header {
			display: flex;
			justify-content: space-between;
			/* 左寄せと右寄せを実現 */
			font-size: 14px;
			padding-right: 10px;
			padding-left: 10px;
		}

		.sub-header .left-side {
			text-align: left;
		}

		.sub-header .right-side {
			text-align: right;
		}

		.sub-header .right-side-small {
			text-align: right;
			font-size: 18px;
		}

		.container {
			padding: 20px;
		}

		/* 銀色の金属リボン */
		.ribbon {
			background: linear-gradient(145deg, #d1d1d1, #e6e6e6);
			/* 銀色のグラデーション */
			border-radius: 5px;
			/* 丸みを帯びた角 */
			padding: 15px;
			font-size: 18px;
			font-weight: bold;
			color: #333;
			/* 文字色を濃くして目立たせる */
			text-shadow: 1px 1px 5px rgba(255, 255, 255, 0.8);
			/* 反射感を出すための光沢感 */
			box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1), inset 0 1px 5px rgba(255, 255, 255, 0.6);
			/* 光沢感と深み */
			margin-bottom: 20px;
		}

		.search-condition {
			display: flex;
			flex-direction: column;
			/* 要素を縦に並べる */
			align-items: center;
			/* 中央寄せ */
			margin-bottom: 20px;
		}

		.section-title {
			text-align: left;
			/* 「■検索条件」を左寄せ */
			font-size: 18px;
			font-weight: bold;
			margin-bottom: 10px;
			width: 100%;
			/* 見出しを中央寄せにしない */
		}

		.search-form {
			width: 80%;
			/* 幅を80%に設定して中央寄せ */
		}

		.search-form label {
			margin-right: 10px;
		}

		.search-form input,
		.search-form select {
			padding: 5px;
			margin-right: 10px;
			margin-bottom: 15px;
			/* 各要素の間隔を広げる */
		}

		.search-form button {
			padding: 10px 20px;
			background-color: #BDD7EE;
			/* 背景色を#BDD7EEに変更 */
			color: black;
			border: none;
			cursor: pointer;
			margin-top: 20px;
			/* ボタンの上に余白を追加 */
		}

		.search-form button:hover {
			background-color: #A1C4D4;
			/* ホバー時に少し暗く */
		}

		.salary-table {
			width: 100%;
			border-collapse: collapse;
			/* ボーダーを崩さない */
			margin-top: 20px;
		}

		.salary-table th,
		.salary-table td {
			border: 1px solid #ddd;
			/* セルの境界線 */
			padding: 8px;
			text-align: center;
		}

		.salary-table th {
			background-color: #BDD7EE;
			/* ヘッダーの背景色 */
			color: black;
			/* 文字色を黒に設定 */
		}

		.salary-table td {
			background-color: #f9f9f9;
		}

		.footer {
			text-align: center;
			margin-top: 20px;
			font-size: 14px;
		}

		.right-align {
			text-align: right;
			/* 右寄せ用クラス */
			margin-bottom: 10px;
		}

		.spaced {
			margin-right: 20px;
			/* 要素の間隔を広げる */
		}

		.row {
			height: 50px;
		}

		.center-row {
			height: 50px;
			text-align: center;
		}

		.row label {
			width: 140px;
			text-align: left;
			display: inline-block;
		}

		.sub-label {
			min-width: 40px;
			width: auto;
			display: inline-block;
		}

		.submit-btn {
			width: 150px;
			height: 50px;
			background: linear-gradient(to bottom, #A1C4D4, #FFFFFF, #A1C4D4);
			border: 0;
			text-decoration-color: #000000;
			font-size: larger;
			text-align: center;
		}

		hr {
			height: 2px;
			background-color: #A1C4D4;
			border: 0;
		}

		dialog {
			width: fit-content;
			height: 150px;
			font-size: 20px;
			position: relative;
		}

		.modal-content {
			white-space: nowrap;
		}

		.modal-btns {
			display: flex;
			justify-content: center;
			gap: 10px;
			position: absolute;
			bottom: 15px;
			left: 0;
			right: 0;
		}

		.modal-btn {
			width: 80px;
			height: 50px;
		}
	</style>
	<script th:inline="javascript">
		const oldData = {
		    syainId: [[${syain.syainId}]],
			firstNameKanji: [[${syain.firstNameKanji}]],
			lastNameKanji: [[${syain.lastNameKanji}]],
			firstNameKana: [[${syain.firstNameKana}]],
			lastNameKana: [[${syain.lastNameKana}]],
			firstNameEigo: [[${syain.firstNameEigo}]],
			lastNameEigo: [[${syain.lastNameEigo}]],
			seibetu: [[${syain.seibetu}]],
			syozokuKaisya: [[${syain.syozokuKaisya}]],
			nyuusyaDate: [[${syain.nyuusyaDate}]],
			taisyaDate: [[${syain.taisyaDate}]],
			syokugyoKind: [[${syain.syokugyoKind}]],
		};
	</script>
	<script type="text/javascript" src="/js/clock.js" defer></script>
	<script type="text/javascript" src="/js/modify.js" defer></script>
</head>

<body>
	<!-- ヘッダー -->
	<header>
		<div class="main-header">社内統合管理システム</div>
		</br>
		<div class="sub-header">
			<div class="left-side">
				<div id="current-time">登録日時：YYYY年MM月DD日 hh時mm分ss秒</div>
			</div>
			<div class="right-side">
				ユーザー名：XXXX <span class="spaced"></span><span class="spaced">権限：XX</span>
				<button>ログアウト</button>
			</div>
		</div>
	</header>

	<!-- メインコンテンツ -->
	<div class="container">
		<!-- リボン -->
		<div class="ribbon">社員管理</div>
		<div class="sub-header">基本情報</div>
		<hr />
		<input type="hidden" id="syainId" th:value="${syain.syainId}" readonly>
		<div class="row">
			<label for="firstNameKanji">社員名（漢字）</label>
			<span class="sub-label">&nbsp;性&nbsp;</span>
			<input type="text" id="firstNameKanji" th:value="${syain.firstNameKanji}">
			<span class="sub-label">&nbsp;名&nbsp;</span>
			<input type="text" id="lastNameKanji" th:value="${syain.lastNameKanji}">
			<span class="sub-label">&nbsp;必須</span>
		</div>
		<div class="row">
			<label for="NameKana">社員名（カタカナ）</label>
			<span class="sub-label">&nbsp;ｾｲ&nbsp;</span>
			<input type="text" id="firstNameKana" th:value="${syain.firstNameKana}">
			<span class="sub-label">&nbsp;ﾒｲ&nbsp;</span>
			<input type="text" id="lastNameKana" th:value="${syain.lastNameKana}">
			<span class="sub-label">&nbsp;必須</span>
		</div>
		<div class="row">
			<label for="NameEigo">社員名（英語）</label>
			<span class="sub-label">&nbsp;first name&nbsp;</span>
			<input type="text" id="firstNameEigo" th:value="${syain.firstNameEigo}">
			<span class="sub-label">&nbsp;last name&nbsp;</span>
			<input type="text" id="lastNameEigo" th:value="${syain.lastNameEigo}">
			<span class="sub-label">&nbsp;必須</span>
		</div>
		<div class="row">
			<label for="seibetu">性別</label>
			<input type="radio" name="seibetu" value="1" th:checked="${syain.seibetu == 1}">男&nbsp;&nbsp;
			<input type="radio" name="seibetu" value="2" th:checked="${syain.seibetu == 2}">女
		</div>

		<div class="sub-header">会社関連情報</div>
		<hr />
		<div class="row">
			<label for="syozokuKaisya">所属会社</label>
			<select id="syozokuKaisya">
				<option th:each="company : ${syozokuKaisya}" th:value="${company.category2}" th:text="${company.value1}"
					th:selected="${company.category2 == syain.syozokuKaisya}">
				</option>
			</select>
		</div>
		<div class="row">
			<label for="nyuusyaDate">入社日</label>
			<input type="date" id="nyuusyaDate" th:value="${nyuusyaDate}">
		</div>
		<div class="row">
			<label for="taisyaDate">退社日</label>
			<input type="text" id="taisyaDate" th:value="${syain.taisyaDate}">&nbsp;※YYYY-MM-DD
		</div>
		<div class="row">
			<label for="syokugyoKind">職業種類</label>
			<select id="syokugyoKind">
				<option th:each="kind : ${syokugyoKind}" th:value="${kind.category3}" th:text="${kind.value1}"
					th:selected="${kind.category3 == syain.syokugyoKind}">
				</option>
			</select>
		</div>
		<hr />
		<div class="center-row">
			<button type="button" class="submit-btn" onclick="checkModify()">更新</button>
		</div>

		<dialog id="modify-check-modal">
			<div class="modal-content">
				社員変更項目がありません。
			</div>
			<div class="modal-btns">
				<button class="modal-btn" onclick="document.getElementById('modify-check-modal').close()">OK</button>
			</div>
		</dialog>

		<!-- フッター -->
		<div class="footer">
			<p>&copy; 2024 社内統合管理システム</p>
		</div>
</body>

</html>
