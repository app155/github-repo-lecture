<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>社内統合管理システム</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			margin: 0;
			padding: 0;
		}

		body .sub-header {
			display: flex;
			justify-content: space-between;
			/* 左寄せと右寄せを実現 */
			font-size: 26px;

			padding-right: 10px;
			padding-left: 5px;
			align-items: baseline;
		}

		header {
			color: black;
			/* 背景色を削除し、文字色を黒に設定 */
			padding: 10px;
			text-align: center;
		}

		header .main-header {
			font-size: 2em;
			/* フォントサイズを2倍に */
		}

		header .sub-header {
			display: flex;
			justify-content: space-between;
			/* 左寄せと右寄せを実現 */
			font-size: 14px;
			padding-right: 10px;
			padding-left: 10px;
		}

		.sub-header .left-side {
			text-align: left;
		}

		.sub-header .right-side {
			text-align: right;
		}

		.sub-header .right-side-small {
			text-align: right;
			font-size: 18px;
		}

		.container {
			padding: 20px;
		}

		/* 銀色の金属リボン */
		.ribbon {
			background: linear-gradient(145deg, #d1d1d1, #e6e6e6);
			/* 銀色のグラデーション */
			border-radius: 5px;
			/* 丸みを帯びた角 */
			padding: 15px;
			font-size: 18px;
			font-weight: bold;
			color: #333;
			/* 文字色を濃くして目立たせる */
			text-shadow: 1px 1px 5px rgba(255, 255, 255, 0.8);
			/* 反射感を出すための光沢感 */
			box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1), inset 0 1px 5px rgba(255, 255, 255, 0.6);
			/* 光沢感と深み */
			margin-bottom: 20px;
		}

		.search-condition {
			display: flex;
			flex-direction: column;
			/* 要素を縦に並べる */
			align-items: center;
			/* 中央寄せ */
			margin-bottom: 20px;
		}

		.section-title {
			text-align: left;
			/* 「■検索条件」を左寄せ */
			font-size: 18px;
			font-weight: bold;
			margin-bottom: 10px;
			width: 100%;
			/* 見出しを中央寄せにしない */
		}

		.search-form {
			width: 80%;
			/* 幅を80%に設定して中央寄せ */
		}

		.search-form label {
			margin-right: 10px;
		}

		.search-form input,
		.search-form select {
			padding: 5px;
			margin-right: 10px;
			margin-bottom: 15px;
			/* 各要素の間隔を広げる */
		}

		.search-form button {
			padding: 10px 20px;
			background-color: #BDD7EE;
			/* 背景色を#BDD7EEに変更 */
			color: black;
			border: none;
			cursor: pointer;
			margin-top: 20px;
			/* ボタンの上に余白を追加 */
		}

		.search-form button:hover {
			background-color: #A1C4D4;
			/* ホバー時に少し暗く */
		}

		.salary-table,
		.skill-table {
			width: 100%;
			border-collapse: collapse;
			/* ボーダーを崩さない */
			margin-top: 20px;
		}

		.salary-table th,
		.salary-table td,
		.skill-table th,
		.skill-table td {
			border: 1px solid #ddd;
			/* セルの境界線 */
			padding: 8px;
			text-align: center;
		}

		.salary-table th,
		.skill-table th {
			background-color: #BDD7EE;
			/* ヘッダーの背景色 */
			color: black;
			/* 文字色を黒に設定 */
		}

		.salary-table td,
		.skill-table td {
			background-color: #f9f9f9;
		}

		.skill-table th {
			width: 15%;
			font-size: 28px;
		}

		.skill-name {
			width: 14%
		}

		.skill-input {
			width: 3%
		}

		.footer {
			text-align: center;
			margin-top: 20px;
			font-size: 14px;
		}

		.right-align {
			text-align: right;
			/* 右寄せ用クラス */
			margin-bottom: 10px;
		}

		.spaced {
			margin-right: 20px;
			/* 要素の間隔を広げる */
		}

		.row {
			height: 50px;
		}

		.center-row {
			height: 50px;
			text-align: center;
		}

		.row label {
			width: 140px;
			text-align: left;
			display: inline-block;
		}

		.sub-label {
			min-width: 40px;
			width: auto;
			display: inline-block;
		}

		.submit-btn {
			width: 150px;
			height: 50px;
			background: linear-gradient(to bottom, #A1C4D4, #FFFFFF, #A1C4D4);
			border: 0;
			text-decoration-color: #000000;
			font-size: larger;
			text-align: center;
		}

		hr {
			height: 2px;
			background-color: #A1C4D4;
			border: 0;
		}

		table {
			margin-bottom: 20px;
		}

		.salary-table input {
			border: 0;
		}
	</style>
	<link rel="stylesheet" href="css/bank_auto.css" />
	<script type="text/javascript" src="/js/clock.js" defer></script>
	<script type="text/javascript" src="/js/register.js" defer></script>
	<script src="https://zipaddr.github.io/bankauto0.js" charset="UTF-8" defer></script>
</head>

<body>
	<!-- ヘッダー -->
	<header>
		<div class="main-header">社内統合管理システム</div>
		</br>
		<div class="sub-header">
			<div class="left-side">
				<div id="current-time">登録日時：YYYY年MM月DD日 hh時mm分ss秒</div>
			</div>
			<div class="right-side">
				ユーザー名：XXXX <span class="spaced"></span><span class="spaced">権限：XX</span>
				<button>ログアウト</button>
			</div>
		</div>
	</header>

	<!-- メインコンテンツ -->
	<div class="container">
		<!-- リボン -->
		<div class="ribbon">社員登録</div>
		<div class="sub-header">基本情報</div>
		<hr />
		<form method="post" onsubmit="registerUser(event)">
			<div class="row">
				<label for="employeecode">社員コード</label>
				<span class="sub-label">&nbsp;</span>
				<input type="text" id="employeecode" name="employeecode">
			</div>
			<div class="row">
				<label for="firstNameKanji">社員名（漢字）</label>
				<span class="sub-label">&nbsp;性&nbsp;</span>
				<input type="text" id="firstNameKanji" name="firstNameKanji">
				<span class="sub-label">&nbsp;名&nbsp;</span>
				<input type="text" id="lastNameKanji" name="lastNameKanji">
				<span class="sub-label">&nbsp;必須</span>
			</div>
			<div class="row">
				<label for="firstNameKanji">社員名（カタカナ）</label>
				<span class="sub-label">&nbsp;ｾｲ&nbsp;</span>
				<input type="text" id="firstNameKana" name="firstNameKana">
				<span class="sub-label">&nbsp;ﾒｲ&nbsp;</span>
				<input type="text" id="lastNameKana" name="lastNameKana">
				<span class="sub-label">&nbsp;必須</span>
			</div>
			<div class="row">
				<label for="firstNameKanji">社員名（英語）</label>
				<span class="sub-label">&nbsp;first name&nbsp;</span>
				<input type="text" id="firstNameEigo" name="firstNameEigo">
				<span class="sub-label">&nbsp;last name&nbsp;</span>
				<input type="text" id="lastNameEigo" name="lastNameEigo">
				<span class="sub-label">&nbsp;必須</span>
			</div>
			<div class="row">
				<label for="seibetu">性別</label>
				<input type="radio" name="seibetu" value="1" checked="true">男&nbsp;&nbsp;
				<input type="radio" name="seibetu" value="2">女
			</div>

			<div class="sub-header">会社関連情報</div>
			<hr />
			<div class="row">
				<label for="syozokuKaisya">所属会社</label>
				<select id="syozokuKaisya" name="syozokuKaisya">
				</select>
			</div>
			<div class="row">
				<label for="nyuusyaDate">入社日</label>
				<input type="date" id="nyuusyaDate" name="nyuusyaDate">
			</div>
			<div class="row">
				<label for="taisyaDate">退社日</label>
				<input type="text" id="taisyaDate" name="taisyaDate" pattern="\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])">&nbsp;※YYYY-MM-DD
			</div>
			<div class="row">
				<label for="syokugyoKind">職業種類</label>
				<select id="syokugyoKind" name="syokugyoKind"></select>
			</div>

			<div class="sub-header">給料関連情報</div>
			<hr />
			<div>
				<table class="salary-table">
					<thead>
						<th>金融機関コード</th>
						<th>金融機関名</th>
						<th>支店名コード</th>
						<th>支店名</th>
						<th>口座種類</th>
						<th>口座番号</th>
						<th>名義人</th>
					</thead>
					<tbody>
						<td>
							<input type="text" style="text-align: center;" name="bank_code" id="bank_code">
						</td>
						<td>
							<input type="text" style="text-align: center;" name="bank_name" id="bank_name" readonly>
						</td>
						<td>
							<input type="text" style="text-align: center;" name="branch_code" id="branch_code">
						</td>
						<td>
							<input type="text" style="text-align: center;" name="branch_name" id="branch_name" readonly>
						</td>
						<td>
							<select name="account_type" id="account_type">
								<option selected="true">普通</option>
							</select>
						</td>
						<td>
							<input type="text" style="text-align: center;" name="account_num" id="account_num">
						</td>
						<td>
							<input type="text" style="text-align: center;" name="owner_name" id="owner_name">
						</td>
					</tbody>
				</table>
			</div>

			<div class="sub-header">
				<div class="left-side">技術経験</div>
				<div class="right-side-small">◎：実務経験１年以上 ／ ○：実務経験有り ／ △：知識有り</div>
			</div>
			<hr />
			<div>
				<table class="skill-table">
					<tbody>
					</tbody>
				</table>
			</div>
			<div class="center-row">
				<button type="submit" class="submit-btn">登録</button>
			</div>
		</form>

		<!-- フッター -->
		<div class="footer">
			<p>&copy; 2024 社内統合管理システム</p>
		</div>
</body>

</html>
